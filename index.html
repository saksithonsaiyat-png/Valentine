<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heart.PROTOCOL</title>
    <style>
        :root {
            --terminal-green: #36ff8b;
            --terminal-dim: rgba(54, 255, 139, 0.7);
            --pink: #ff4f9a;
            --crimson: #ff174d;
            --deep-red: #b8003d;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: #000000;
            color: var(--terminal-green);
            font-family: "Courier New", Courier, monospace;
        }

        .screen {
            position: relative;
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 2rem;
            background:
                radial-gradient(circle at 50% 40%, rgba(255, 23, 77, 0.08), transparent 34rem),
                linear-gradient(rgba(54, 255, 139, 0.025) 50%, transparent 50%);
            background-size: auto, 100% 4px;
        }

        .terminal {
            width: min(92vw, 760px);
            padding: clamp(1.25rem, 4vw, 2.25rem);
            border: 1px solid rgba(54, 255, 139, 0.35);
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.72);
            box-shadow: 0 0 22px rgba(54, 255, 139, 0.12), inset 0 0 32px rgba(54, 255, 139, 0.04);
            transition: opacity 900ms ease, transform 900ms ease, filter 900ms ease;
        }

        .terminal.decrypting {
            opacity: 0;
            transform: translateY(-20px) scale(0.98);
            filter: blur(8px);
            pointer-events: none;
        }

        .line {
            margin: 0;
            font-size: clamp(1rem, 2.8vw, 1.35rem);
            line-height: 1.7;
            letter-spacing: 0.03em;
            text-shadow: 0 0 10px rgba(54, 255, 139, 0.7);
        }

        .typewriter {
            display: inline-block;
            width: 0;
            max-width: fit-content;
            overflow: hidden;
            white-space: nowrap;
            border-right: 0.12em solid var(--terminal-green);
            animation:
                typing 3.2s steps(43, end) forwards,
                cursor 700ms step-end infinite;
        }

        @keyframes typing { to { width: 43ch; } }
        @keyframes cursor { 50% { border-color: transparent; } }

        .fade-line {
            opacity: 0;
            color: var(--terminal-dim);
            animation: fadeIn 1.1s ease forwards;
            animation-delay: 3.45s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .decrypt-button {
            margin-top: 2.25rem;
            padding: 0.9rem 1.35rem;
            border: 1px solid rgba(54, 255, 139, 0.8);
            border-radius: 4px;
            background: transparent;
            color: var(--terminal-green);
            font: 700 clamp(0.9rem, 2.4vw, 1rem) "Courier New", Courier, monospace;
            letter-spacing: 0.16em;
            cursor: pointer;
            opacity: 0;
            box-shadow: 0 0 15px rgba(54, 255, 139, 0.18), inset 0 0 12px rgba(54, 255, 139, 0.08);
            text-shadow: 0 0 9px rgba(54, 255, 139, 0.75);
            animation: fadeIn 1s ease forwards;
            animation-delay: 4.15s;
            transition: color 200ms ease, border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
        }

        .decrypt-button:hover,
        .decrypt-button:focus-visible {
            color: #000;
            background: var(--terminal-green);
            border-color: #b6ffd5;
            box-shadow: 0 0 28px rgba(54, 255, 139, 0.55);
            transform: translateY(-2px);
            outline: none;
        }

        .heart-field {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        .heart {
            position: relative;
            width: min(92vw, 720px);
            height: min(86vh, 640px);
            opacity: 0;
            transition: opacity 500ms ease;
            transform-origin: center;
        }

        .heart.visible { opacity: 1; }
        .heart.beating { animation: heartbeat 1.35s ease-in-out infinite; }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            18% { transform: scale(1.045); }
            34% { transform: scale(0.992); }
            52% { transform: scale(1.065); }
            72% { transform: scale(1); }
        }

        .love-particle {
            position: absolute;
            left: 50%;
            top: 50%;
            color: #ffd1e4;
            font-weight: 700;
            font-size: clamp(0.48rem, 1.55vw, 0.92rem);
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.45);
            text-shadow:
                0 0 5px #fff,
                0 0 12px var(--pink),
                0 0 24px var(--crimson),
                0 0 42px var(--deep-red);
            animation: particleIn 650ms ease forwards;
            will-change: transform, opacity;
        }

        @keyframes particleIn {
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .sound-hint {
            display: block;
            margin-top: 0.8rem;
            color: rgba(255, 209, 228, 0.7);
            font-size: clamp(0.72rem, 2vw, 0.88rem);
            letter-spacing: 0.08em;
            text-shadow: 0 0 10px rgba(255, 79, 154, 0.45);
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 4.55s;
        }

        .final-message {
            position: fixed;
            bottom: clamp(0.8rem, 3vh, 2rem);
            left: 50%;
            width: min(90vw, 620px);
            color: #ffe0ec;
            font-size: clamp(1.05rem, 3vw, 1.6rem);
            line-height: 1.4;
            text-align: center;
            text-shadow: 0 0 14px var(--pink), 0 0 30px var(--crimson);
            opacity: 0;
            transform: translateX(-50%) translateY(14px);
            transition: opacity 900ms ease, transform 900ms ease;
        }

        .final-message.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 560px) {
            .screen { padding: 1rem; }
            .terminal { border-radius: 10px; }
            @keyframes typing { to { width: 34ch; } }
            .typewriter { white-space: normal; animation: fadeIn 1.5s ease forwards, cursor 700ms step-end infinite; width: auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 1ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="screen" aria-live="polite">
        <section class="terminal" id="terminal" aria-label="Encrypted romantic terminal">
            <p class="line"><span class="typewriter">[system] initializing heart.PROTOCOL v2.0...</span></p>
            <p class="line fade-line">&gt; One encrypted package bound for you.</p>
            <button class="decrypt-button" id="decryptButton" type="button">DECRYPT MESSAGE</button>
            <span class="sound-hint" id="soundHint">sound effects armed ♡</span>
        </section>
    </main>

    <div class="heart-field" aria-hidden="true">
        <div class="heart" id="heart"></div>
    </div>
    <div class="final-message" id="finalMessage">decryption complete: I love you, endlessly.</div>

    <script>
        const button = document.getElementById('decryptButton');
        const terminal = document.getElementById('terminal');
        const heart = document.getElementById('heart');
        const finalMessage = document.getElementById('finalMessage');
        const soundHint = document.getElementById('soundHint');
        let audioContext;
        let masterGain;

        function setupAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) {
                soundHint.textContent = 'visual mode active ♡';
                return false;
            }

            if (!audioContext) {
                audioContext = new AudioContext();
                masterGain = audioContext.createGain();
                masterGain.gain.value = 0.16;
                masterGain.connect(audioContext.destination);
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            return true;
        }

        function playTone(frequency, startTime, duration, type = 'sine', volume = 0.18) {
            if (!audioContext || !masterGain) return;

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, startTime);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
            oscillator.connect(gain);
            gain.connect(masterGain);
            oscillator.start(startTime);
            oscillator.stop(startTime + duration + 0.04);
        }

        function playDecryptSound() {
            if (!setupAudio()) return;

            const now = audioContext.currentTime;
            [392, 494, 659, 988].forEach((note, index) => {
                playTone(note, now + index * 0.07, 0.12, 'triangle', 0.13);
            });
            playTone(1568, now + 0.34, 0.18, 'sine', 0.1);
        }

        function playHeartMelody() {
            if (!audioContext || !masterGain) return;

            const now = audioContext.currentTime + 0.05;
            const melody = [523.25, 659.25, 783.99, 1046.5, 987.77, 783.99, 880, 1046.5];
            melody.forEach((note, index) => {
                playTone(note, now + index * 0.16, 0.22, 'sine', 0.11);
            });

            playTone(261.63, now, 1.55, 'triangle', 0.045);
            playTone(392, now + 0.32, 1.25, 'triangle', 0.04);
        }

        function playHeartbeatPop() {
            if (!audioContext || !masterGain) return;

            const now = audioContext.currentTime;
            playTone(220, now, 0.09, 'sine', 0.16);
            playTone(330, now + 0.13, 0.13, 'sine', 0.12);
            playTone(880, now + 0.28, 0.24, 'triangle', 0.08);
        }

        function createHeart(playSound = true) {
            heart.innerHTML = '';
            heart.classList.add('visible');
            heart.classList.remove('beating');

            const particleCount = 132;
            const rect = heart.getBoundingClientRect();
            const scale = Math.min(rect.width / 38, rect.height / 34);
            const centerX = rect.width / 2;
            const points = [];
            let minY = Infinity;
            let maxY = -Infinity;

            for (let i = 0; i < particleCount; i++) {
                const t = (Math.PI * 2 * i) / particleCount;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y);
                points.push({ x, y });
            }

            const visualCenterY = (minY + maxY) / 2;
            const centerY = rect.height / 2 + visualCenterY * scale;
            const fragment = document.createDocumentFragment();

            points.forEach(({ x, y }, i) => {
                const particle = document.createElement('span');

                particle.className = 'love-particle';
                particle.textContent = 'I love you';
                particle.style.left = `${centerX + x * scale}px`;
                particle.style.top = `${centerY - y * scale}px`;
                particle.style.animationDelay = `${i * 24}ms`;
                particle.style.color = i % 3 === 0 ? '#ffffff' : i % 3 === 1 ? '#ffd1e4' : '#ff8fbd';
                fragment.appendChild(particle);
            });

            heart.appendChild(fragment);
            if (playSound) playHeartMelody();

            window.setTimeout(() => {
                heart.classList.add('beating');
                finalMessage.classList.add('visible');
                if (playSound) playHeartbeatPop();
            }, particleCount * 24 + 750);
        }

        button.addEventListener('click', () => {
            button.disabled = true;
            playDecryptSound();
            terminal.classList.add('decrypting');
            window.setTimeout(() => createHeart(true), 850);
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            if (!heart.classList.contains('visible')) return;
            window.clearTimeout(resizeTimer);
            resizeTimer = window.setTimeout(() => createHeart(false), 180);
        });
    </script>
</body>
</html>
